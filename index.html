<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Města Česka</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
  <link rel="stylesheet" href="./styl.css">
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
  <script defer src="./map.js"></script>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1><span class="map-emblem" aria-hidden="true"></span>Města Česka</h1>
      <button id="reset-view" class="overview-button" type="button" disabled>
        Přehled Česka
      </button>
    </header>

    <div class="layout">
      <aside class="city-panel" aria-labelledby="city-heading">
        <h2 id="city-heading">Vyberte město</h2>
        <p id="map-status" role="status">Načítám města…</p>
        <noscript>Pro zobrazení mapy povolte JavaScript.</noscript>
        <ul id="cities" class="city-list"></ul>
      </aside>

      <div id="map" role="region" aria-label="Interaktivní mapa Česka"></div>
    </div>
  </main>
</body>
</html>
